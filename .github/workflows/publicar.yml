name: Publicar apostilas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e verificar arquivos
        run: python3 transferir.py
      - name: Publicar PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create apostilas-2026 ./*.pdf --title "SP em Ação 2026" --notes "Manuais do professor, volumes 1 a 3."
